name: haulio-local-demo

services:
  fe:
    build:
      context: .
    environment:
      NODE_ENV: production
      BACKEND_URL: http://be:3001
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
